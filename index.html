["dolphin_spawn_egg","Dauphin au QG","Bassin avec air en surface et plafond","dolphins_grace"],
["nautilus_spawn_egg","Nautile apprivoisé et sellé","Apprivoisé avec un poisson-globe","breath_of_the_nautilus"]]},
{id:"q",tab:"prep",t:"Installations du QG",s:"Zone où tu te tiens pour recevoir tous les effets d’un coup.",i:[
["iso_beacon","Balise niveau 4 : Haste + Régénération","Haste ne s’obtient que par balise · portée 50 blocs","haste regeneration"],
["iso_beacon","2e balise (optionnel) : Résistance","Utile si tu n’as pas de pomme dorée enchantée","resistance"],
["conduit","Conduit actif","Portée jusqu’à 96 blocs · il faut être dans l’eau ou sous la pluie","conduit_power"],
["iso_dispenser","Distributeurs à tir rapide","Circuit horloge (deux observers face à face) · mur derrière toi pour ne rien rater",""],
["iso_dispenser","Lanceur de flèches spectrales","Distributeur rempli de flèches + plaque de pression, hors d’atteinte de la lévitation",""],
["water_bucket","Bassin du dauphin + couloir d’eau d’un bloc","Trappe fermable pour entrer dans le couloir",""],
["shulker_shell","Couloir du shulker avec plafond","La lévitation ne doit pas te faire sortir de la zone",""],
["wither_rose","Rose du Wither plantée","Sur du sable des âmes au-dessus du nautile",""],
["iso_obsidian","Portail du Nether QG ↔ village du Nether","Passage rapide : Raid Omen ne dure que 30 secondes",""],
["hopper","Piège à raid (optionnel)","Plus sûr, et récupère totems et émeraudes",""],
["iso_shrieker","QG construit près du sculk shrieker","Ancient City ou Deep Dark : y amener shulker, dauphin et nautile",""]]},
{id:"s",tab:"day",t:"Séquence du jour J",s:"Du plus long au plus court, d’après un guide communautaire pour la 26.2.",i:[
["totem_of_undying","1. Bouteille sinistre → gagner le raid","Hero of the Village (40 min)",""],
["trial_key","2. Bouteille sinistre → Trial Chambers","Trial Omen (15 min × niveau de la bouteille)",""],
["elder_guardian_spawn_egg","3. Gardien ancien","Mining Fatigue (5 min)",""],
["golden_apple_ench","4. QG : tir rapide de potions + pomme dorée enchantée","Manger la pomme pendant que les potions tombent",""],
["bell","5. Bouteille sinistre au village du Nether","Raid Omen (30 s) → repasser tout de suite par le portail",""],
["ominous_bottle","6. Dernière bouteille sinistre au QG","Bad Omen : il disparaît à chaque conversion, donc à reprendre en dernier",""],
["spectral_arrow","7. Flèche spectrale, puis poisson-globe pendant le tir du shulker","Glowing + Levitation + Hunger / Nausea / Poison",""],
["iso_shrieker","8. Couloir d’eau : dauphin + shrieker, puis nautile","Dolphin’s Grace + Darkness + Breath of the Nautilus",""],
["wither_rose","9. Rose du Wither, puis ragoût à la houstonie bleue","Wither + Blindness → l’avancement se déclenche",""]]}
];
const EF="absorption bad_omen blindness breath_of_the_nautilus conduit_power darkness dolphins_grace fire_resistance glowing haste hero_of_the_village hunger infested invisibility jump_boost levitation mining_fatigue nausea night_vision oozing poison raid_omen regeneration resistance slow_falling slowness speed strength trial_omen water_breathing weakness weaving wither wind_charged".split(" ");
const nm=k=>k==="dolphins_grace"?"Dolphin’s Grace":k.split("_").map((w,i)=>i&&(w==="of"||w==="the")?w:w[0].toUpperCase()+w.slice(1)).join(" ");
const SRC={};
D.forEach(s=>s.i.forEach((a,k)=>{(a[3]||"").split(" ").filter(Boolean).forEach(e=>(SRC[e]=SRC[e]||[]).push({id:s.id+k,t:a[1]}))}));
let S={done:{},custom:[],closed:{},hide:false,tab:"prep"};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=s=>document.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const img=(k,c)=>{const e=document.createElement("img");e.src=IC[k]||"";e.alt="";if(c)e.className=c;return e};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function render(){
  const root=$("#list");root.textContent="";
  $("#tprep").className="btn"+(S.tab==="prep"?" on":"");$("#tday").className="btn"+(S.tab==="day"?" on":"");
  if(S.tab==="prep"){
    const on=EF.filter(e=>(SRC[e]||[]).some(x=>S.done[x.id]));
    const p=h("div","panel");
    const hd=h("div","glob");hd.append(h("span","","Effets couverts par ta préparation"),h("span","",on.length+" / "+EF.length));
    p.append(hd,h("div","note","Mis à jour automatiquement quand tu coches une tâche. Cette liste n’entre pas dans la progression."));
    const g=h("div","fx");
    EF.forEach(e=>{
      const t=h("div","tile "+(on.includes(e)?"on":"off"));
      t.title=(SRC[e]||[]).map(x=>x.t).join("\n")||"Aucune tâche liée";
      const sl=h("div","slot");sl.append(img("fx_"+e));t.append(sl,h("div","",nm(e)));g.append(t);
    });
    p.append(g);root.append(p);
  }
  let tot=0,dn=0;
  D.filter(s=>s.tab===S.tab).forEach(sec=>{
    const items=sec.i.map((a,k)=>({id:sec.id+k,ic:a[0],t:a[1],n:a[2]}))
      .concat(S.custom.filter(c=>c.sec===sec.id).map(c=>({id:c.id,ic:"nether_wart",t:c.t,n:"Tâche perso",c:1})));
    const d=items.filter(x=>S.done[x.id]).length;tot+=items.length;dn+=d;
    const det=h("details","panel");det.open=!S.closed[sec.id];
    det.addEventListener("toggle",()=>{if(det.open)delete S.closed[sec.id];else S.closed[sec.id]=1;save()});
    const sm=h("summary");sm.append(h("span","",sec.t),h("span","ct",d+" / "+items.length));
    const b=h("div","xp"),bi=h("i");bi.style.width=(items.length?d/items.length*100:0)+"%";b.append(bi);sm.append(b);
    det.append(sm,h("p","desc",sec.s));
    const ul=h("ul");
    items.forEach(x=>{
      if(S.hide&&S.done[x.id])return;
      const li=h("li",S.done[x.id]?"done":"");
      const lb=h("label","row"),cb=h("input");cb.type="checkbox";cb.checked=!!S.done[x.id];
      cb.addEventListener("change",()=>{if(cb.checked)S.done[x.id]=1;else delete S.done[x.id];save();render()});
      const sl=h("div","slot");sl.append(img(x.ic));
      const tx=h("span","tx");tx.append(h("b","",x.t));if(x.n)tx.append(h("small","",x.n));
      lb.append(cb,sl,tx);li.append(lb);
      if(x.c){const del=h("button","del","✕");del.title="Supprimer";
        del.addEventListener("click",()=>{S.custom=S.custom.filter(c=>c.id!==x.id);delete S.done[x.id];save();render()});li.append(del)}
      ul.append(li);
    });
    det.append(ul);if(!ul.children.length)det.append(h("p","empty","Tout est terminé ici !"));
    root.append(det);
  });
  const p=tot?Math.round(dn/tot*100):0;
  $("#gl").textContent=S.tab==="prep"?"Progression de la préparation":"Progression du jour J";
  $("#gp").textContent=p+" % ("+dn+" / "+tot+")";$("#gb").style.width=p+"%";
}
D.forEach(s=>{const o=h("option","",s.t);o.value=s.id;$("#sec").append(o)});
function add(){const v=$("#txt").value.trim();if(!v)return;
  S.custom.push({id:"c"+Date.now(),sec:$("#sec").value,t:v});$("#txt").value="";save();render()}
const tab=t=>{S.tab=t;const f=D.find(s=>s.tab===t);$("#sec").value=f.id;save();render()};
$("#tprep").addEventListener("click",()=>tab("prep"));$("#tday").addEventListener("click",()=>tab("day"));
$("#addb").addEventListener("click",add);
$("#txt").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
$("#hide").checked=!!S.hide;
$("#hide").addEventListener("change",e=>{S.hide=e.target.checked;save();render()});
$("#all").addEventListener("click",()=>{const ids=D.filter(s=>s.tab===S.tab).map(s=>s.id);
  const some=ids.some(i=>S.closed[i]);ids.forEach(i=>{if(some)delete S.closed[i];else S.closed[i]=1});save();render()});
let armed=0;
$("#rst").addEventListener("click",e=>{
  if(!armed){armed=1;e.target.textContent="Confirmer la remise à zéro ?";setTimeout(()=>{armed=0;e.target.textContent="Réinitialiser"},3500);return}
  S.done={};S.custom=[];save();armed=0;e.target.textContent="Réinitialiser";render()});
$("#sec").value=D.find(s=>s.tab===S.tab).id;
render();
</script>
</body>
</html>
